{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<form method="post" style="max-width:340px;margin:60px auto;display:grid;gap:12px">
  {% csrf_token %}
  <h2 style="margin:0">Вход</h2>
  {% if form.errors %}<div class="muted" style="color:#e5484d">Неверный логин или пароль</div>{% endif %}
  <input type="text" name="username" placeholder="Логин" autofocus required>
  <input type="password" name="password" placeholder="Пароль" required>
  <button class="primary">Войти</button>
</form>
{% endblock %}
